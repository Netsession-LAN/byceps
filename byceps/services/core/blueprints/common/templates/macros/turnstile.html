{%- macro render_turnstile(action, theme='auto') %}
  {%- set sitekey = get_turnstile_sitekey() %}
  {%- if sitekey %}
    <div class="cf-turnstile" data-sitekey="{{ sitekey }}" data-action="{{ action }}" data-theme="{{ theme }}"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {%- endif %}
{%- endmacro %}
